# tmux — managed by ~/Dev/projects/.dotfiles, symlinked as ~/.config/tmux.
#
# Design rule for this file: NOTHING here rebinds or unbinds a default key.
# Every `bind` below fills a slot tmux leaves empty, so the stock keys you
# learn from `man tmux` and `prefix ?` keep working exactly as documented.
# Verify after any edit with the diff recipe in tmux/README.md — it must
# report additions only.
#
# Colors are Ghostty's own palette (ghostty/config): Tango on #300a24, so
# the status bar reads as part of the terminal rather than a box on top.

# ---- Terminal capabilities ----
# tmux-256color carries the full terminfo (italics, undercurl); the RGB flag
# tells tmux the outer terminal really does 24-bit color, which Ghostty does.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# ---- Behaviour ----
set -g mouse on
set -g escape-time 10          # 500ms default makes vim's Esc feel broken
set -g focus-events on         # lets nvim autoread/autocmd see focus changes
set -g history-limit 50000
set -g display-time 2000
set -g set-clipboard on        # OSC 52 — copies reach the macOS clipboard
setw -g aggressive-resize on

# Window/pane numbering is left at the tmux default (0-based) on purpose:
# the manual, every tutorial and `prefix 0` all assume it.

# ---- Additive keys (all of these are unbound in stock tmux) ----
# Pane focus and resize, vim-style. prefix + arrows / C-arrows still work.
#
# Note the modifiers: bare `l` and `L` are NOT used, because tmux ships them
# as last-window and switch-client -l. C-hjkl and M-hjkl are genuinely free,
# which is why the vim letters live behind a modifier here.
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# prefix R reloads this file. Stock `prefix r` is refresh-client, untouched.
bind R source-file "${HOME}/.config/tmux/tmux.conf" \; display "tmux.conf reloaded"

# prefix g — fzf project picker in a popup. Stock `prefix f` (find-window)
# and `prefix s` (session tree) are untouched.
bind g display-popup -E -w 80% -h 60% "${HOME}/.config/tmux/scripts/sessionizer.sh"

# ---- Palette ----
%hidden BASE="#300a24"
%hidden SURFACE="#45193a"
%hidden OVERLAY="#5b2a4d"
%hidden TEXT="#eeeeec"
%hidden MUTED="#d3d7cf"
%hidden GREEN="#8ae234"
%hidden PURPLE="#ad7fa8"
%hidden CYAN="#34e2e2"
%hidden AMBER="#fce94f"
%hidden RED="#ef2929"

# ---- Pane borders ----
# The active pane is named and lit; inactive borders recede into the bg.
set -g pane-border-style "fg=${OVERLAY}"
set -g pane-active-border-style "fg=${GREEN}"
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=${GREEN}#,bold],#[fg=${MUTED}]}#{pane_current_command} "

# ---- Status bar ----
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=${SURFACE},fg=${MUTED}"
set -g message-style "bg=${AMBER},fg=${BASE},bold"
set -g mode-style "bg=${OVERLAY},fg=${TEXT}"

# Left: session name. Flips to amber the moment the prefix is live, so you
# always know whether tmux or the shell is about to eat the next key.
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[bg=${AMBER}],#[bg=${PURPLE}]}#[fg=${BASE},bold]  #S #{?client_prefix,#[fg=${AMBER}],#[fg=${PURPLE}]}#[bg=${SURFACE}]"

set -g window-status-separator ""
set -g window-status-format "#[fg=${MUTED},bg=${SURFACE}] #I #W#{?window_zoomed_flag, ,}#{?window_last_flag,  ,} "
set -g window-status-current-format "#[fg=${SURFACE},bg=${OVERLAY}]#[fg=${GREEN},bg=${OVERLAY},bold] #I #W#{?window_zoomed_flag, ,} #[fg=${OVERLAY},bg=${SURFACE},nobold]"
set -g window-status-bell-style "fg=${RED},bg=${SURFACE},bold"

# Right: kube context, git branch, host, clock. The two #() segments run
# scripts/status.sh, which prints nothing at all when the tool is missing —
# no kubectl, no kube segment, no error.
set -g status-right-length 100
set -g status-right "#[fg=${OVERLAY},bg=${SURFACE}]#[fg=${CYAN},bg=${OVERLAY}] #(${HOME}/.config/tmux/scripts/status.sh k8s) #[fg=${GREEN},bg=${OVERLAY}]#(${HOME}/.config/tmux/scripts/status.sh git '#{pane_current_path}') #[fg=${PURPLE},bg=${OVERLAY}]#[fg=${BASE},bg=${PURPLE},bold]  #h  %H:%M "
